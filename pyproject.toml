[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tracelens"
version = "0.2.1"
description = "A reproducible deep learning workbench for system log anomaly detection"
requires-python = ">=3.11"
dependencies = ["torch>=2.6,<3", "numpy>=2,<3", "scikit-learn>=1.6,<2", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
tracelens = "tracelens.cli:main"

[tool.setuptools.packages.find]
include = ["tracelens*"]

[tool.setuptools.package-data]
tracelens = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
